<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeOFF</title>
<meta name="description" content="CodeOFF — desenvolvimento de software e aplicativos.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
  :root{--bg:#f7f8fa;--fg:#14161a;--muted:#5b6472;--accent:#2f6df6;--border:#e3e6eb}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--fg:#e7e9ee;--muted:#9aa3b2;--accent:#7aa2ff;--border:#262b35}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:40px 16px;background:var(--bg);color:var(--fg);text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;line-height:1.6}
  h1{font-size:clamp(34px,9vw,52px);margin:0;letter-spacing:-0.03em}
  h1 span{color:var(--accent)}
  p{margin:0;color:var(--muted);max-width:42ch}
  nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
  nav a{color:var(--accent);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:9px 18px;font-size:15px}
  nav a:hover{text-decoration:underline}
</style>
</head>
<body>
  <h1>Code<span>OFF</span></h1>
  <p>Desenvolvimento de software e aplicativos móveis.</p>
  <nav>
    <a href="/privacy">Política de Privacidade</a>
    <a href="mailto:contato@codeoff.com.br">contato@codeoff.com.br</a>
  </nav>
</body>
</html>
